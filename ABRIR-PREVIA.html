<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia | Rotas na Prática</title><style>
:root{font-family:'DM Sans',Arial,sans-serif;color:#17223b;background:#f3f6fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}a{text-decoration:none;color:inherit}.app-shell{min-height:100vh;display:flex;flex-direction:column}.header{background:#101d3d;color:white;padding:19px max(24px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:-.8px}.brand span{color:#7ea3ff}.header nav{display:flex;gap:10px;flex-wrap:wrap}.nav-link{padding:10px 16px;border-radius:9px;color:#c0cbe2;font-weight:600}.nav-link:hover,.nav-link.active{background:#293d6a;color:#fff}.content-grid{width:min(1140px,100%);margin:0 auto;padding:42px 24px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;flex:1}.sidebar{background:white;border:1px solid #e1e6f2;border-radius:17px;padding:22px;align-self:start;display:flex;flex-direction:column;gap:5px;box-shadow:0 8px 30px #202a4410}.eyebrow{font-size:12px;color:#4b6bc9;letter-spacing:1.8px;font-weight:800;margin:0 0 17px}.sidebar .eyebrow{font-size:10px;margin-bottom:10px}.sidebar>a{padding:12px 10px;border-radius:9px;color:#394760;font-weight:600;font-size:14px}.sidebar>a:hover,.sidebar>a.active{background:#eef3ff;color:#335acf}.sidebar-tip{background:#f3f6fc;color:#5a6680;border-radius:10px;margin-top:20px;padding:13px;font-size:13px;line-height:1.6}.page{min-width:0;padding:12px 0}h1{font-size:clamp(30px,4vw,46px);line-height:1.15;letter-spacing:-1.8px;margin:0 0 22px;font-weight:800}h1 span{color:#4269df}.lead{font-size:17px;color:#62718b;line-height:1.8;max-width:660px;margin:0 0 27px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:33px}.button{display:inline-flex;justify-content:center;align-items:center;padding:13px 20px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .15s}.button:hover{transform:translateY(-2px)}.button.primary{background:#4169e1;color:#fff;box-shadow:0 8px 18px #4269df33}.button.ghost{background:#e6edff;color:#375bc8}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.feature,.info-panel,.profile{background:#fff;border:1px solid #e1e6f2;border-radius:16px;box-shadow:0 8px 30px #202a440b}.feature{padding:22px 18px}.feature .emoji{font-size:27px}.feature h3{margin:15px 0 9px;font-size:17px}.feature p{font-size:13px;line-height:1.65;color:#66738b;margin:0}.info-panel{padding:25px 30px;margin-bottom:28px;color:#5b6980;line-height:1.8}.info-panel h2{color:#263858;margin:0 0 12px}.info-panel ul{padding-left:20px}.profile{display:flex;align-items:center;gap:25px;padding:30px;margin-bottom:25px}.avatar{font-size:57px;background:#edf2ff;display:grid;place-items:center;border-radius:22px;min-width:110px;height:110px}.profile h2{margin:0 0 5px;font-size:25px}.profile p{color:#63718b;line-height:1.6}.role{font-weight:800;color:#456bd8!important}.id-note{font-size:13px}.id-note code{background:#edf2ff;color:#395cc8;padding:3px 7px;border-radius:4px}.huge-404{font-size:100px;color:#4269df;font-weight:800;line-height:1}.not-found{text-align:center;padding-top:40px}.not-found .lead{margin-left:auto;margin-right:auto}.footer{background:#101d3d;color:#aab8d2;text-align:center;font-size:13px;padding:25px 15px}.loading{text-align:center;padding:80px;color:#4269df;font-weight:700}@media(max-width:760px){.content-grid{grid-template-columns:1fr;padding:22px 16px;gap:18px}.sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px;gap:3px}.sidebar .eyebrow,.sidebar-tip{display:none}.sidebar>a{font-size:12px;padding:9px}.header{padding:18px 16px}.feature-grid{grid-template-columns:1fr}.profile{align-items:flex-start;flex-direction:column}h1{letter-spacing:-1px}}</style></head><body><div class="app-shell"><header class="header"><a class="brand" href="#/">◈ Rotas<span>naPrática</span></a><nav><a class="nav-link" href="#/">Home</a><a class="nav-link" href="#/about">Sobre</a><a class="nav-link" href="#/contact">Contato</a></nav></header><div class="content-grid"><aside class="sidebar"><p class="eyebrow">NAVEGAÇÃO EXTRA</p><a href="#/user/1">👤 Perfil 1</a><a href="#/user/2">👤 Perfil 2</a><a href="#/user/3">👤 Perfil 3</a><a href="#/pagina-inexistente">⚠ Testar página 404</a><div class="sidebar-tip">💡 Nesta prévia, o endereço usa # para funcionar sem servidor e sem npm.</div></aside><main class="page" id="page"></main></div><footer class="footer">Prévia HTML independente • O React real está no projeto ZIP</footer></div><script>
const users={'1':['Ana Silva','Desenvolvedora Front-end','👩🏽‍💻','Adora React, interfaces e experiências acessíveis.'],'2':['Bruno Costa','Designer de Interfaces','👨🏻‍🎨','Cria layouts bonitos e fáceis de usar.'],'3':['Carla Souza','Estudante de Tecnologia','👩🏾‍🎓','Aprendendo rotas, componentes e estados em React.']};
const button=(path,label,cls='primary')=>`<a class="button ${cls}" href="#${path}">${label}</a>`;
function render(){const path=decodeURIComponent(location.hash.replace(/^#/,''))||'/';let h='';
if(path==='/'){h=`<p class="eyebrow">PÁGINA INICIAL</p><h1>Bem-vindo ao <span>Rotas na Prática</span></h1><p class="lead">Aprenda a navegar entre páginas sem recarregar o site, compartilhar layouts e criar rotas dinâmicas.</p><div class="actions">${button('/about','Conhecer o projeto →')}${button('/user/1','Ver perfil de exemplo','ghost')}</div><div class="feature-grid"><article class="feature"><div class="emoji">🧭</div><h3>React Router</h3><p>Navegação usando Routes, Route, Link e NavLink.</p></article><article class="feature"><div class="emoji">⚡</div><h3>Lazy Loading</h3><p>Importação sob demanda com lazy e Suspense.</p></article><article class="feature"><div class="emoji">🧩</div><h3>Layout comum</h3><p>Header, Sidebar e Footer compartilhados via Outlet.</p></article></div>`}
else if(path==='/about'){h=`<p class="eyebrow">SOBRE</p><h1>Um projeto para <span>aprender fazendo.</span></h1><p class="lead">Neste exemplo, as páginas ficam em componentes separados, mas usam o mesmo layout.</p><div class="info-panel"><h2>O que você vai praticar?</h2><ul><li>Route e Routes</li><li>Link e NavLink</li><li>Parâmetros com useParams</li><li>lazy e Suspense</li><li>Rota * para páginas inválidas</li></ul></div>${button('/contact','Ir para Contato →')}`}
else if(path==='/contact'){h=`<p class="eyebrow">CONTATO</p><h1>Vamos <span>conversar?</span></h1><p class="lead">Página fictícia criada para demonstrar uma terceira rota no aplicativo.</p><div class="info-panel"><h2>Fale com a equipe</h2><p>📧 contato@exemplo.com</p><p>📍 Projeto didático — sem envio real.</p></div>${button('/','Voltar para Home →')}`}
else if(/^\/user\/[0-9]+$/.test(path)){const id=path.split('/')[2],u=users[id];h=u?`<p class="eyebrow">ROTA DINÂMICA: /user/${id}</p><h1>Perfil de <span>usuário</span></h1><div class="profile"><div class="avatar">${u[2]}</div><div><h2>${u[0]}</h2><p class="role">${u[1]}</p><p>${u[3]}</p><p class="id-note">Parâmetro da URL: <code>${id}</code></p></div></div>${button('/','← Voltar','ghost')}`:`<p class="eyebrow">PERFIL NÃO ENCONTRADO</p><h1>Usuário <span>desconhecido.</span></h1><p class="lead">ID não cadastrado.</p>${button('/','Ir para Home')}`}
else{h=`<section class="not-found"><div class="huge-404">404</div><h1>Ops! Página não encontrada.</h1><p class="lead">Esta URL não corresponde a nenhuma página cadastrada.</p>${button('/','Voltar para Home →')}</section>`}
document.getElementById('page').innerHTML=h;document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+path));}addEventListener('hashchange',render);render();</script></body></html>
